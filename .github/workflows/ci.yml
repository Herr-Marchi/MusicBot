name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Ruff lint
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy src

      - name: Unit tests
        run: python -m pytest -m unit

  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musicbot
          POSTGRES_PASSWORD: musicbot
          POSTGRES_DB: musicbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musicbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run migrations against a real database
        env:
          DATABASE_URL: postgresql+psycopg://musicbot:musicbot@localhost:5432/musicbot
        run: alembic upgrade head

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musicbot
          POSTGRES_PASSWORD: musicbot
          POSTGRES_DB: musicbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musicbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://musicbot:musicbot@localhost:5432/musicbot
      INTEGRATION_REDIS_URL: redis://localhost:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Integration tests
        run: python -m pytest -m integration

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t music-bot:ci .
